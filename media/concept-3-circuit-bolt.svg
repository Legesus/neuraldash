<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bolt-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow-bolt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Tile -->
  <rect width="256" height="256" rx="56" fill="#0d1117" />
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="rgba(52,211,153,0.16)" stroke-width="2" />

  <!-- Circuit Trace Lines -->
  <path d="M 52 134 H 84 L 98 120" fill="none" stroke="#1f293d" stroke-width="6" stroke-linecap="round" />
  <path d="M 204 122 H 172 L 158 136" fill="none" stroke="#1f293d" stroke-width="6" stroke-linecap="round" />
  <path d="M 138 42 V 68" fill="none" stroke="#1f293d" stroke-width="6" stroke-linecap="round" />
  <path d="M 118 214 V 188" fill="none" stroke="#1f293d" stroke-width="6" stroke-linecap="round" />

  <!-- Solder Pads / Nodes -->
  <circle cx="52" cy="134" r="7" fill="#10b981" />
  <circle cx="52" cy="134" r="3" fill="#0d1117" />
  <circle cx="204" cy="122" r="7" fill="#06b6d4" />
  <circle cx="204" cy="122" r="3" fill="#0d1117" />
  <circle cx="138" cy="42" r="6" fill="#34d399" />
  <circle cx="118" cy="214" r="6" fill="#3b82f6" />

  <!-- Central Razor Bolt -->
  <path d="M 144 42 L 86 138 H 130 L 112 214 L 174 118 H 132 Z" 
        fill="url(#bolt-grad-3)" filter="url(#glow-bolt)" />
  
  <!-- Secondary Accent Edge -->
  <path d="M 144 42 L 132 118 H 174 L 112 214" 
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
</svg>

